# CI 门禁（系统性改造第 4 步）—— GitHub Actions 模板
# 仓库若托管在 GitHub/Gitee Actions 可直接启用；
# 本地提交前检查用 scripts/ci-check.ps1。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: 类型 + 规范 + 测试 + 契约 + 构建 + 审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 质量门禁
        run: npm run quality
      - name: 高危依赖审计
        run: npm audit --audit-level=high
